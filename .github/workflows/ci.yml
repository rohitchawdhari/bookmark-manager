name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookmark_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Database URL
        run: echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/bookmark_manager" >> $GITHUB_ENV

      - name: Generate Prisma Client
        run: bunx --bun prisma generate

      - name: Run Database Migrations
        run: bunx --bun prisma migrate dev --skip-generate

      - name: Run Sanity Checks (Lint, Typecheck, Test)
        run: bun run sanity
